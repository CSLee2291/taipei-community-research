name: Build and Validate Project

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Markdown links
        run: node research/scripts/check-markdown-links.mjs

      - name: Validate research data
        run: node research/scripts/validate-data-layer.mjs

      - name: Verify CSV and JSON synchronization
        run: node research/scripts/export-data-layer-json.mjs --check

      - name: Rebuild Wanhua research database
        run: node research/scripts/build-wanhua-database.mjs

      - name: Check generated research files
        run: |
          git diff --exit-code -- \
            data/csv/CommunityProfile.csv \
            data/json/CommunityProfile.json \
            data/processed/wanhua-community-associations.json \
            dashboard/app/data/wanhua-community-associations.json \
            dashboard/public/data/wanhua-community-associations.json \
            docs/community-list.md \
            report/wanhua

      - name: Check Python syntax
        run: python -m compileall -q research/scripts

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test dashboard
        working-directory: dashboard
        run: npm test

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Build static website
        run: node research/scripts/build-static-site.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            website/dist
            dashboard/dist
          if-no-files-found: error
          retention-days: 14
