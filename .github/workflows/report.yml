name: Generate Research Report

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Generate PDF, Word, SVG, and PNG
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib
          sudo apt-get update
          sudo apt-get install --yes pandoc texlive-xetex fonts-noto-cjk

      - name: Validate and rebuild research data
        run: |
          node research/scripts/validate-data-layer.mjs
          node research/scripts/build-wanhua-database.mjs

      - name: Generate report charts
        run: python research/scripts/generate-report-figures.py

      - name: Build report source
        run: node research/scripts/build-report-source.mjs

      - name: Generate Word report
        run: |
          pandoc report/output/wanhua-research-report.md +            --from=gfm +            --standalone +            --resource-path=report/output:report/wanhua +            --output=report/output/wanhua-research-report.docx

      - name: Generate PDF report
        run: |
          pandoc report/output/wanhua-research-report.md +            --from=gfm +            --standalone +            --resource-path=report/output:report/wanhua +            --pdf-engine=xelatex +            --variable=mainfont:"Noto Sans CJK TC" +            --variable=geometry:margin=25mm +            --output=report/output/wanhua-research-report.pdf

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: research-report-${{ github.run_number }}
          path: report/output
          if-no-files-found: error
          retention-days: 30
