name: Build Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Build dashboard artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Rebuild Wanhua activity research outputs
        run: node research/scripts/build-community-activities.mjs

      - name: Validate research data
        run: node research/scripts/validate-data-layer.mjs

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Test and build dashboard
        working-directory: dashboard
        run: npm test

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ github.run_number }}
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 14
